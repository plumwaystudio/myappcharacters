name: Render COOL OFF The Receipt
on:
  push:
    paths:
      - 'skits/cool-off-receipt/**'
      - '.github/workflows/render-cool-off.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python skits/cool-off-receipt/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: cool-off-receipt-first-pass
          path: skits/cool-off-receipt/out/video.mp4
          if-no-files-found: error
